name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Backup Database
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            docker exec postiz-postgres pg_dump -U postiz-user postiz-db > /home/ubuntu/backup_$(date +%Y%m%d_%H%M%S).sql

      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            # Navigate to project directory
            cd /home/ubuntu/postiz-app
            
            # Pull latest changes
            git pull origin main
            
            # Pull latest Docker images
            docker compose pull
            
            # Restart services
            docker compose down
            docker compose up -d
            
            # Show status
            echo "Deployment completed!"
            docker compose ps
            
            # Show last 20 lines of logs
            docker compose logs --tail=20 postiz

      - name: Health Check
        run: |
          echo "Waiting for application to start..."
          sleep 30
          
          # Retry health check up to 6 times (1 minute total)
          max_attempts=6
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt of $max_attempts..."
            
            if curl --fail --silent --show-error https://postiz.dev > /dev/null 2>&1; then
              echo "✅ Health check passed!"
              exit 0
            fi
            
            if [ $attempt -lt $max_attempts ]; then
              echo "⏳ Application not ready, waiting 10 seconds..."
              sleep 10
            fi
            
            attempt=$((attempt + 1))
          done
          
          echo "❌ Health check failed after $max_attempts attempts"
          exit 1

      - name: Deployment notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
